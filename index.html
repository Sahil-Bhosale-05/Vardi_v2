<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0E0F12">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Vardi: Defense & Govt Fitness Training</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Persistent Global Top Bar -->
  <header class="top" id="top-bar">
    <div class="top-inner">
      <div class="brand" data-act="nav-home" style="cursor:pointer;">
        <span class="logo">
          <svg viewBox="0 0 24 24"><path d="M13 3L5 14h6l-1 7 8-11h-6z"/></svg>
        </span>
        Vardi
      </div>
      
      <div class="tools">
        <div class="who-wrap" id="who-wrap" hidden>
          <span class="who-badge" id="who-code">AR</span>
          <span class="who" id="who">Army Agniveer</span>
        </div>
        <button class="ib" id="tm" data-act="tm" aria-label="Open timers" hidden>
          <svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/></svg>
        </button>
        <button class="ib" data-act="theme" aria-label="Switch light or dark theme">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v16"/></svg>
        </button>
        <button class="ib" data-act="menu" aria-label="Open menu">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="5" r="1.6" fill="currentColor" stroke="none"/>
            <circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/>
            <circle cx="12" cy="19" r="1.6" fill="currentColor" stroke="none"/>
          </svg>
        </button>

        <!-- Global 3-Dot Dropdown -->
        <div class="dropdown hidden" id="main-menu">
          <button class="dd-item" data-act="nav-home">
            <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Home
          </button>
          <button class="dd-item" data-act="nav-prog">
            <svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"/></svg>
            Progress
          </button>
          <button class="dd-item" data-act="nav-acct">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-7 8-7s8 3 8 7"/></svg>
            Account
          </button>
          <button class="dd-item" data-act="nav-faq">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><circle cx="12" cy="17" r="1" fill="currentColor" stroke="none"/></svg>
            FAQ
          </button>
        </div>
      </div>
    </div>
  </header>
  
  <main id="app" class="wrap"></main>
  
  <nav class="tabs" id="tabs" hidden>
    <div class="tabs-inner" id="tabs-inner"></div>
  </nav>

  <!-- Timers & Modal Bottom Sheet -->
  <div class="sheet" id="sheet" hidden></div>

  <script src="js/data.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
